name: Publish (npm)

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm install -g npm@~11.10.0 # Work-around for https://github.com/npm/cli/issues/9151#issuecomment-4131466208
      - run: npm i -g npm@latest
      - run: npm ci
      - run: npm version ${TAG_NAME} --git-tag-version=false
        env:
          TAG_NAME: ${{ github.ref_name }}
      - name: Report Rollouts deployment start
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "publish-npm"
          CHANGE_MONITOR_SERVICE: "module-replacements"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.workflow }}:${{ github.job }}:module-replacements:publish-npm"
        run: |
          export DEPLOY_VERSION="$(git rev-parse HEAD)"
          bash .github/scripts/rollouts-reporter.sh bootstrap
          bash .github/scripts/rollouts-reporter.sh start
      - run: npm publish --provenance --access public --tag next
        if: 'github.event.release.prerelease'
      - run: npm publish --provenance --access public
        if: '!github.event.release.prerelease'
      - name: Report Rollouts deployment finish
        if: always()
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CHANGE_MONITOR_ENV: "publish-npm"
          CHANGE_MONITOR_SERVICE: "module-replacements"
          CHANGE_MONITOR_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          CHANGE_MONITOR_ACTOR: "github-actions:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.workflow }}:${{ github.job }}:module-replacements:publish-npm"
          CHANGE_MONITOR_OUTCOME: ${{ job.status }}
        run: bash .github/scripts/rollouts-reporter.sh finish
